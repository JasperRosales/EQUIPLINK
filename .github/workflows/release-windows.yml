name: Windows Release

# Push a tag like v1.2.0 to build the installer and publish a GitHub Release.
# Installed copies check this repo's latest release on startup and update themselves.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.3 (got '$VERSION')"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      # jpackage (JDK 17) builds MSIs with WiX 3.
      - name: Ensure WiX 3
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
          }
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" |
                 Select-Object -First 1
          if ($wix) { Add-Content $env:GITHUB_PATH "$($wix.FullName)\bin" }

      - name: Build jar
        shell: bash
        run: |
          mkdir -p build/classes build/input
          find src -name '*.java' > build/sources.txt
          javac -encoding UTF-8 -nowarn -cp "lib/*" -d build/classes @build/sources.txt
          mkdir -p build/classes/src/assets
          cp -r src/assets/. build/classes/src/assets/
          cp room.md build/classes/room.md
          printf 'version=%s\nrepo=%s\n' "$VERSION" "$GITHUB_REPOSITORY" \
            > build/classes/equiplink.properties
          CP=$(cd lib && ls *.jar | tr '\n' ' ')
          printf 'Main-Class: src.Main\nClass-Path: %s\n' "$CP" > build/manifest.txt
          jar cfm build/input/equiplink.jar build/manifest.txt -C build/classes .
          cp lib/*.jar build/input/

      - name: Package MSI
        shell: bash
        run: |
          jpackage --type msi \
            --name EquipLink \
            --app-version "$VERSION" \
            --vendor "EquipLink" \
            --description "Campus equipment borrowing system" \
            --input build/input \
            --main-jar equiplink.jar \
            --main-class src.Main \
            --icon src/assets/equiplink.ico \
            --win-per-user-install \
            --win-dir-chooser \
            --win-menu --win-menu-group EquipLink \
            --win-shortcut \
            --win-upgrade-uuid ae55204b-945a-4508-8ae8-111fb443d77b \
            --dest build/dist
          mv build/dist/*.msi "build/dist/EquipLink-$VERSION.msi"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: EquipLink ${{ env.VERSION }}
          generate_release_notes: true
          files: build/dist/EquipLink-${{ env.VERSION }}.msi
